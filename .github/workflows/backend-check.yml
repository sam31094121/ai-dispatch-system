name: Backend Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch_app_red
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dispatch_app_red/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check backend entrypoints
        run: npm run check
