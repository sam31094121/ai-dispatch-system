<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zhaogui AI Dispatch - Master Shell</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #09111f; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans TC', sans-serif; }
    #boot-sequence { text-align: center; color: #18c6a7; z-index: 100; transition: opacity 0.8s; }
    .logo { font-size: 48px; font-weight: 900; letter-spacing: 8px; margin-bottom: 20px; animation: pulse-glow 2s infinite; }
    .status { font-size: 12px; letter-spacing: 4px; opacity: 0.8; }
    .loader-bar { width: 200px; height: 2px; background: rgba(24, 198, 167, 0.1); margin: 20px auto; position: relative; overflow: hidden; }
    .loader-progress { position: absolute; top: 0; left: 0; height: 100%; background: #18c6a7; width: 0; transition: width 0.5s; box-shadow: 0 0 10px #18c6a7; }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="boot-sequence">
    <div class="logo" style="color: #f3c14b; text-shadow: 0 0 20px rgba(243,193,75,0.5);">ZHAOGUI AI</div>
    <div class="status" style="color: #f3c14b;">MOBILE COMMANDER OS</div>
    <div class="loader-bar" style="background: rgba(243,193,75,0.1); border: 1px solid rgba(243,193,75,0.2); height: 4px;">
      <div id="progress" class="loader-progress" style="background: #f3c14b; box-shadow: 0 0 15px #f3c14b;"></div>
    </div>
    <div id="sub-status" style="font-size: 10px; opacity: 0.6; color: #f3c14b; letter-spacing: 2px;">SECURE MOBILE ACCESS INITIALIZING...</div>
  </div>

  <script>
    // 全系統行動化 (Mobile-Only) 強制跳轉邏輯
    (function() {
      const progress = document.getElementById('progress');
      const subStatus = document.getElementById('sub-status');
      const messages = [
        "ENCRYPTING DATA...",
        "ADAPTING SPATIAL MAPPING...",
        "SYNCING NEURAL NET...",
        "LAUNCHING MOBILE COMMANDER..."
      ];
      
      let step = 0;
      const interval = setInterval(() => {
        step += 25;
        progress.style.width = step + '%';
        subStatus.textContent = messages[Math.floor(step / 26)];
        
        if (step >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('boot-sequence').style.opacity = '0';
            setTimeout(() => {
              // 強制開啟手機專用版，並帶入 master 參數
              window.location.href = 'mobile.html?mode=mobile&source=master_shell';
            }, 800);
          }, 500);
        }
      }, 400);
    })();
  </script>
</body>
</html>
