<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 派單">
  <meta name="description" content="AI 比例原則動態加  <title>AI 派單戰情室 v7</title>
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="war-room-mode">
  <div id="app-shell">
    <!-- 頂部：標題與同步 -->
    <header class="header-main">
      <div class="brand">
        <h1>AI 派單戰情室</h1>
        <span class="version-tag">5/10 派單正式版</span>
      </div>
      <button id="refresh-data" class="btn-refresh">同步數據</button>
    </header>

    <main class="content-grid">
      <!-- 第一層：核心數據與審計 (高密度佈局) -->
      <section class="dashboard-top">
        <div class="card audit-card">
          <div class="card-label">審計狀態</div>
          <div id="audit-result" class="val-status">PENDING</div>
          <div id="audit-notes" class="mini-notes"></div>
        </div>
        <div class="card summary-card">
          <div class="card-label">本輪整合總盤</div>
          <div id="summary-grid" class="summary-mini-grid">
            <!-- 實收、總額、追續、單數 -->
          </div>
        </div>
      </section>

      <!-- 第二層：前四名尊榮舞台 (精簡 3D) -->
      <section class="hero-stage">
        <div class="stage-header">TOP 4 英雄榜</div>
        <div id="a1-hero-grid" class="hero-flex"></div>
      </section>

      <!-- 第三層：名次總表 (高清晰表格) -->
      <section class="table-section">
        <div class="table-header">
          <h3>正式名次總表</h3>
          <button id="search-open" class="btn-search">🔍 檢索</button>
        </div>
        <div id="ranking-list" class="ranking-v3"></div>
      </section>

      <!-- 第四層：分級與建議 (資訊流) -->
      <section class="info-flow">
        <div id="groups-grid" class="groups-v3"></div>
        <div id="advice-list" class="advice-v3"></div>
      </section>

      <!-- 第五層：公告操作 (固定於底部) -->
      <section class="footer-actions">
        <button id="copy-line-text" class="btn-primary">複製正式版公告</button>
        <button id="copy-short-text" class="btn-secondary">精簡版</button>
      </section>
    </main>
  </div>

  <!-- 隱藏區：數據緩存與公告 -->
  <div hidden>
    <textarea id="broadcast-output"></textarea>
    <div id="group-short-output"></div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 搜尋 Modal -->
  <div id="search-modal" class="modal">
    <div class="modal-content">
      <header><h3>名次檢索</h3> <button id="search-close">×</button></header>
      <input type="text" id="lookup-input" placeholder="輸入姓名...">
      <div id="lookup-results"></div>
    </div>
  </div>

  <script src="mobile.js"></script>
</body>
</html>

      <div class="section-head">
        <h2>名次快速檢索</h2>
        <button id="search-close" class="icon-button">✕</button>
      </div>

      <div id="lookup-results" class="lookup-results"></div>

  <script src="/mobile.js?v=0509-war-room"></script>
