<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI 派單終端｜5/4 正式版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Sora:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mobile.css?v=0504-purge-lock">
</head>
<body>
  <div id="app" class="cyber-layout">
    <!-- 背景光效 -->
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <!-- 頂部英雄區 -->
    <header class="hero-section">
      <div class="system-status">
        <span class="status-dot pulsing"></span>
        <span class="status-text">AI CORE ONLINE</span>
      </div>
      <h1 id="main-title">AI 派單公告</h1>
      <div class="date-tags">
        <span id="settlement-date-tag" class="tag">結算 --/--</span>
        <span class="tag-arrow">→</span>
        <span id="dispatch-date-tag" class="tag primary">派單 --/--</span>
      </div>
      
      <div class="hero-stats">
        <div class="stat-pill" data-status="PASS">
          <label>審計結果</label>
          <strong id="audit-result">-</strong>
        </div>
        <div class="stat-pill">
          <label>正式人數</label>
          <strong id="active-count">-</strong>
        </div>
      </div>
    </header>

    <!-- 個人查詢區 (浮動按鈕觸發) -->
    <div class="search-trigger" id="search-open">
      <span class="icon">🔍</span>
      <span class="text">快速查詢</span>
    </div>

    <!-- 主內容區 -->
    <main class="content-container">
      
      <!-- 戰報總盤 -->
      <section class="panel" id="summary">
        <div class="panel-header">
          <span class="eyebrow">Overall Stats</span>
          <h2>整合總盤數據</h2>
        </div>
        <div id="summary-grid" class="summary-grid">
          <!-- JS 動態插入 -->
        </div>
      </section>

      <!-- 名次大榜 (核心) -->
      <section class="panel" id="ranking">
        <div class="panel-header">
          <span class="eyebrow">Elite Ranking</span>
          <h2>正式派單排行榜</h2>
        </div>
        <div id="ranking-list" class="ranking-list">
          <!-- JS 動態插入 -->
        </div>
      </section>

      <!-- 派單分級 -->
      <section class="panel" id="groups">
        <div class="panel-header">
          <span class="eyebrow">Tier Distribution</span>
          <h2>A1 / A2 / B / C 分級</h2>
        </div>
        <div id="groups-grid" class="groups-grid">
          <!-- JS 動態插入 -->
        </div>
      </section>

      <!-- 審計說明 -->
      <section class="panel" id="audit">
        <div class="panel-header">
          <span class="eyebrow">Audit Log</span>
          <h2>審計異常與提醒</h2>
        </div>
        <div id="audit-notes" class="audit-notes"></div>
        <div id="excluded-list" class="excluded-list"></div>
      </section>

      <!-- 群組精簡版 -->
      <section class="panel" id="broadcast">
        <div class="panel-header">
          <span class="eyebrow">Broadcast Text</span>
          <h2>群組超精簡版</h2>
          <button id="copy-broadcast" class="btn-icon">📋</button>
        </div>
        <div id="broadcast-output" class="broadcast-box"></div>
      </section>

      <!-- 底部安全緩衝區 -->
      <div class="bottom-safe-buffer"></div>
    </main>

    <!-- 底部導航欄 -->
    <nav class="bottom-nav">
      <a href="#summary" class="nav-item">總盤</a>
      <a href="#ranking" class="nav-item active">排行</a>
      <a href="#groups" class="nav-item">分級</a>
      <a href="#broadcast" class="nav-item">轉發</a>
    </nav>

    <!-- 查詢彈窗 -->
    <div id="search-modal" class="modal">
      <div class="modal-content">
        <h3>快速定位成員</h3>
        <input type="text" id="lookup-input" placeholder="輸入姓名或姓氏..." autofocus>
        <div id="lookup-results" class="lookup-results"></div>
        <button id="search-close" class="btn-close">關閉</button>
      </div>
    </div>

    <!-- 全局提示 -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="/mobile.js?v=0504-purge-lock"></script>
</body>
</html>
