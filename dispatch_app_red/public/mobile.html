<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09111f">
  <title>正式派單公告｜已同步最新資料</title>
  <!-- Open Graph：控制 LINE / FB 分享預覽顯示 -->
  <meta property="og:title" content="正式派單公告｜已同步最新資料">
  <meta property="og:description" content="AI 比例原則動態加權，每日正式派單順序同步更新。">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mobile.css?v=0505-a1-hero-top">
</head>
<body>
  <div id="app-shell">

    <header class="topbar">
      <div>
        <p class="kicker">Zhaogui AI Dispatch</p>
        <h1 id="main-title">AI 派單公告</h1>
      </div>
      <div class="topbar-actions">
        <button id="refresh-data" class="icon-button" type="button" aria-label="重新整理">↻</button>
        <span id="audit-result" class="status-badge">--</span>
      </div>
    </header>

    <!-- ① 前4名英雄區：topbar 下方，第一眼主角 -->
    <section id="a1-hero" aria-label="A1 高優先主力">
      <div class="a1-hero-header">
        <div class="a1-hero-title-block">
          <span class="a1-hero-kicker">🔴 A1 高優先主力｜今日必派首席</span>
          <span class="a1-hero-dates">
            結算 <strong id="hero-settlement-date">--</strong>
            &nbsp;→&nbsp;
            派單 <strong id="hero-dispatch-date">--</strong>
          </span>
        </div>
        <span id="audit-result-hero" class="status-badge">--</span>
      </div>
      <div id="a1-hero-grid" class="a1-hero-grid"></div>
    </section>

    <!-- ② 統計帶：英雄區後 -->
    <section class="date-strip" aria-label="整合統計">
      <div>
        <span>追續成交</span>
        <strong id="stat-renewal-deals">--</strong>
      </div>
      <div>
        <span>總業績</span>
        <strong id="stat-total-revenue">--</strong>
      </div>
      <div>
        <span>實收</span>
        <strong id="stat-cash-revenue">--</strong>
      </div>
    </section>

    <main>

      <section class="panel" id="summary">
        <div class="section-head">
          <div>
            <p class="kicker">Overall Stats</p>
            <h2>整合總盤</h2>
          </div>
        </div>
        <div id="summary-grid" class="summary-grid"></div>
      </section>

      <section class="panel" id="ranking">
        <div class="section-head">
          <div>
            <p class="kicker">Official Ranking</p>
            <h2>正式派單名次</h2>
          </div>
          <button id="search-open" class="icon-button" type="button" aria-label="搜尋姓名">⌕</button>
        </div>
        <div id="ranking-list" class="ranking-list"></div>
      </section>

      <section class="panel" id="groups">
        <div class="section-head">
          <div>
            <p class="kicker">Tier Distribution</p>
            <h2>A1 / A2 / B / C 分級</h2>
          </div>
        </div>
        <div id="groups-grid" class="groups-grid"></div>
      </section>

      <section class="panel" id="audit">
        <div class="section-head">
          <div>
            <p class="kicker">Audit Log</p>
            <h2>審計提醒</h2>
          </div>
        </div>
        <div id="audit-notes" class="audit-notes"></div>
        <div id="excluded-list" class="excluded-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="#a1-hero">A1</a>
      <a href="#summary">總盤</a>
      <a href="#ranking">名次</a>
      <a href="#groups">分級</a>
    </nav>

    <div id="search-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="modal-panel">
        <div class="section-head">
          <h2 id="search-title">搜尋姓名</h2>
          <button id="search-close" class="icon-button" type="button" aria-label="關閉">×</button>
        </div>
        <input id="lookup-input" type="search" placeholder="輸入姓名，例如：馬秋香" autocomplete="off">
        <div id="lookup-results" class="lookup-results"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/mobile.js?v=0505-a1-hero-top"></script>
</body>
</html>
