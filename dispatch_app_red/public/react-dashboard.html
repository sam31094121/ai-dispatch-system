<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 派單戰情室｜至尊邏輯科技版</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💠</text></svg>">

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0,react-dom@18.2.0"
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;700;900&display=swap');
    
    body { 
      background-color: #00040a; 
      color: #e2e8f0; 
      font-family: 'Noto Sans TC', sans-serif; 
      -webkit-tap-highlight-color: transparent;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 70%),
        linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      background-attachment: fixed;
    }
    
    .font-tech { font-family: 'Share Tech Mono', monospace; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.9); }
    .custom-scrollbar::-webkit-scrollbar-thumb { 
      background: linear-gradient(to bottom, #00f0ff, #7000ff); 
      border-radius: 10px;
    }
    
    /* 霸氣銳利邊框與玻璃面板 */
    .tech-panel { 
      background: rgba(8, 16, 28, 0.8); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(0, 240, 255, 0.1); 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }
    .tech-panel::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
    }

    /* 頂級王者發光特效 (霸氣金) */
    .glory-glow-1 { 
      border: 1px solid rgba(255, 176, 0, 0.3);
      background: linear-gradient(135deg, rgba(255, 176, 0, 0.15) 0%, rgba(8, 16, 28, 0.9) 100%);
      box-shadow: 0 0 20px rgba(255, 176, 0, 0.1);
    }
    
    .glory-glow-other { 
      border: 1px solid rgba(0, 240, 255, 0.2);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1) 0%, rgba(8, 16, 28, 0.9) 100%);
    }

    .neon-input {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(30, 41, 59, 0.5);
      border-left: 3px solid #00f0ff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .neon-input:focus {
      border-color: #00f0ff;
      background: rgba(0, 10, 20, 0.8);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      outline: none;
    }
    
    html, body { overflow-x: hidden; width: 100%; scroll-behavior: smooth; }
    
    .scan-line {
      position: absolute; top: 0; left: 0; right: 0; height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 240, 255, 0.03) 50%, 
        transparent 50.1%, 
        transparent 100%
      );
      background-size: 100% 4px;
      pointer-events: none;
      opacity: 0.5;
      z-index: 50;
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .cyber-grid {
      position: fixed; inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      perspective: 1000px;
      transform: rotateX(60deg) translateY(-200px);
      transform-origin: top;
      opacity: 0.2;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { motion, AnimatePresence } from "framer-motion";
    import {
      Copy, CheckCircle2, AlertTriangle, TrendingUp, TrendingDown,
      Minus, ShieldAlert, Terminal, Save, RefreshCw, Wrench, Crosshair, Cpu, Fingerprint
    } from "lucide-react";

    const nf = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 });
    const formatNum = (v) => nf.format(v);

    const ThreeCore = ({ size = 120 }) => {
      const containerRef = React.useRef();

      React.useEffect(() => {
        if (!containerRef.current) return;
        const width = size, height = size;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        containerRef.current.appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(1, 2);
        const material = new THREE.MeshPhongMaterial({
          color: 0x00f0ff,
          wireframe: true,
          emissive: 0x00f0ff,
          emissiveIntensity: 0.5,
          transparent: true,
          opacity: 0.8
        });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        const light = new THREE.PointLight(0x00f0ff, 2, 10);
        light.position.set(2, 2, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 2.5;

        const animate = () => {
          requestAnimationFrame(animate);
          core.rotation.x += 0.01;
          core.rotation.y += 0.01;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          renderer.dispose();
          if (containerRef.current) containerRef.current.removeChild(renderer.domElement);
        };
      }, [size]);

      return <div ref={containerRef} style={{ width: size, height: size }} className="opacity-80" />;
    };

    const SkeletonCard = () => (
      <div className="tech-panel p-4 h-32 shimmer bg-slate-900/50 opacity-50 border-dashed border-slate-700"></div>
    );

    function AIDispatchDashboard() {
      const [data, setData] = useState(null);
      const [copied, setCopied] = useState(false);
      const [error, setError] = useState(null);
      
      const [rawInput, setRawInput] = useState("");
      const [isBusy, setIsBusy] = useState(false);
      const [actionStatus, setActionStatus] = useState({ type: 'idle', message: 'AWAITING_INPUT' });

      const getMaxes = (snapshot, key) => {
        const ranking = snapshot.standardData?.正式名次 || [];
        if (!ranking.length) return { max: 0, names: [] };
        const maxVal = Math.max(...ranking.map(r => Number(r.metrics?.[key] || 0)));
        if (maxVal <= 0) return { max: 0, names: [] };
        const names = ranking.filter(r => Number(r.metrics?.[key] || 0) === maxVal).map(r => r.name);
        return { max: maxVal, names };
      };

      const parseSnapshot = (snapshot) => {
        let summary = { followupCount: 0, totalRevenue: 0, followupAmount: 0, receivedAmount: 0 };
        
        if (snapshot.standardData && snapshot.standardData.整合總盤) {
          const sb = snapshot.standardData.整合總盤;
          summary.followupCount = sb["追續單成交"] || sb["追續單數"] || 0;
          summary.totalRevenue = sb["全部總業績"] || sb["總業績"] || 0;
          summary.followupAmount = sb["追續單金額"] || sb["續單金額"] || 0;
          summary.receivedAmount = sb["實收總金額"] || sb["實收"] || 0;
        }

        return {
          title: snapshot.title || snapshot.standardData?.公告標題 || "SYS.DISPATCH.PREVIEW",
          subTitle: snapshot.persisted ? "LOCKED // CYBER_COMMAND_CENTER_ACTIVE" : "UNLOCKED // PREVIEW_MODE_ACTIVE",
          analysis: {
            actualMax: getMaxes(snapshot, '實收'),
            renewalAmtMax: getMaxes(snapshot, '追續金額'),
            totalMax: getMaxes(snapshot, '全部總業績'),
            renewalAvgMax: getMaxes(snapshot, '追續客單價'),
            renewalCountMax: getMaxes(snapshot, '追續單數')
          },
          audit: {
            result: snapshot.audit?.status || snapshot.validation?.status || "PASS",
            platformChecks: snapshot.audit?.platforms ? snapshot.audit.platforms.map(p => ({
              platform: p.platformName,
              totalRevenue: p.metrics["本月業績"],
              isPass: p.passed
            })) : []
          },
          summary: summary,
          rankingList: (snapshot.ranking || []).map(r => ({
            rank: r.rank,
            name: r.name,
            finalScore: r.weightedScore || r.totalScore || 0,
            group: r.group || r.分級,
            rankChange: r.movement === "flat" ? "same" : (r.movement || "same"),
            advice: r.advice || r.建議 || "AI 判定：維持當前戰略。",
            isNew: r.isNew || r.標記
          })),
          fullAnnouncementText: snapshot.rawText || snapshot.sourceText || "DATA.LOADING...",
          isPersisted: snapshot.persisted
        };
      };

      const loadCurrent = () => {
        setIsBusy(true);
        fetch('/api/current')
          .then(res => res.json())
          .then(json => {
            if(json.success && json.data) {
               setData(parseSnapshot(json.data));
               setActionStatus({ type: 'pass', message: 'SYNC_COMPLETE' });
               setRawInput(json.data.rawText || "");
               // 播放初始化完成音效
               const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-20.mp3');
               audio.volume = 0.05;
               audio.play().catch(() => {});
            } else { throw new Error(json.message || 'READ_FAIL'); }
          })
          .catch(err => {
            setError("SYS.ERROR: DATABASE_CONNECTION_FAILED");
          })
          .finally(() => setIsBusy(false));
      };

      useEffect(() => { loadCurrent(); }, []);

      const requestAction = async (endpoint, payload) => {
        setIsBusy(true);
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          setIsBusy(false);
          return { ok: res.ok, data: json };
        } catch (err) {
          setIsBusy(false);
          return { ok: false, data: { message: err.message } };
        }
      };

      const handleAudit = async () => {
        if (!rawInput.trim()) return setActionStatus({ type: 'fail', message: 'ERR_EMPTY_INPUT' });
        setActionStatus({ type: 'scanning', message: 'EXECUTING_AUDIT...' });
        const { ok, data } = await requestAction('/api/audit', { rawText: rawInput });
        if (data.data) setData(parseSnapshot(data.data));
        setActionStatus({ type: ok && data.success ? 'pass' : 'fail', message: ok && data.success ? 'AUDIT_PASSED' : 'AUDIT_FAILED' });
      };

      const handleSave = async () => {
        if (!rawInput.trim()) return setActionStatus({ type: 'fail', message: 'ERR_EMPTY_INPUT' });
        setActionStatus({ type: 'scanning', message: 'OVERRIDING_SYSTEM...' });
        const { ok, data } = await requestAction('/api/save', { rawText: rawInput });
        if (data.data) setData(parseSnapshot(data.data));
        setActionStatus({ type: ok && data.success ? 'pass' : 'fail', message: ok && data.success ? 'SYS_OVERRIDDEN' : 'OVERRIDE_FAILED' });
      };

      const handleSmartFix = async () => {
        if (!rawInput.trim()) return setActionStatus({ type: 'fail', message: 'ERR_EMPTY_INPUT' });
        setActionStatus({ type: 'scanning', message: 'AI_FIXING...' });
        const { ok, data } = await requestAction('/api/smart-fix', { rawText: rawInput });
        if (ok && data.success && data.data) {
          setRawInput(data.data.fixedText);
          setActionStatus({ type: 'pass', message: 'LOGIC_REPAIRED' });
        } else {
          setActionStatus({ type: 'fail', message: 'REPAIR_FAILED' });
        }
      };

      const handleCopy = () => {
        if(!data) return;
        navigator.clipboard.writeText(data.fullAnnouncementText);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const getRankIcon = (type) => {
        switch (type) {
          case "up": return <TrendingUp className="w-3 h-3 text-[#00ff88]" />;
          case "down": return <TrendingDown className="w-3 h-3 text-[#ff3366]" />;
          case "new": return <span className="text-[#ffb000] font-tech text-[10px] font-bold">NEW</span>;
          default: return <Minus className="w-3 h-3 text-slate-500" />;
        }
      };

      if (error) {
        return <div className="min-h-screen flex items-center justify-center text-[#ff3366] font-tech text-xl tracking-widest"><AlertTriangle className="w-8 h-8 mr-3" /> {error}</div>;
      }

      if (!data) {
        return <div className="min-h-screen flex items-center justify-center text-[#00f0ff] font-tech text-xl tracking-widest"><Cpu className="w-8 h-8 mr-3 animate-pulse" /> INITIALIZING_MAINFRAME...</div>;
      }

      const eliteRanks = data.rankingList.filter(r => r.rank <= 4);
      const standardRanks = data.rankingList.filter(r => r.rank > 4);

      return (
        <div className="min-h-screen p-2 md:p-6 font-sans">
          <div className="max-w-5xl mx-auto space-y-4 md:space-y-6">
            
            {/* 上層控制台 (霸氣科技版) */}
            <div className="tech-panel p-3 md:p-5">
              <div className="scan-line"></div>
              <div className="flex flex-col gap-3 relative z-10">
                <div className="flex justify-between items-end border-b border-[#00f0ff]/30 pb-2">
                  <h2 className="text-sm md:text-base font-bold text-[#00f0ff] font-tech flex items-center gap-2 tracking-widest">
                    <Terminal className="w-4 h-4" />
                    [COMMAND_OVERRIDE_CONSOLE]
                  </h2>
                  <span className={`px-2 py-0.5 text-[10px] md:text-xs font-tech border ${
                    actionStatus.type === 'pass' ? 'bg-[#00ff88]/10 text-[#00ff88] border-[#00ff88]/50' :
                    actionStatus.type === 'fail' ? 'bg-[#ff3366]/10 text-[#ff3366] border-[#ff3366]/50' :
                    actionStatus.type === 'scanning' ? 'bg-[#00f0ff]/10 text-[#00f0ff] border-[#00f0ff]/50 animate-pulse' :
                    'bg-slate-900 text-slate-500 border-slate-700'
                  }`}>
                    {actionStatus.message}
                  </span>
                </div>

                <textarea 
                  value={rawInput}
                  onChange={(e) => setRawInput(e.target.value)}
                  placeholder="> AWAITING_DATA_INPUT..."
                  className="w-full h-[80px] md:h-[120px] neon-input text-[#00f0ff] p-2 md:p-3 outline-none font-tech text-[10px] md:text-xs resize-y custom-scrollbar"
                />

                <div className="grid grid-cols-4 gap-2 mt-1">
                  <button onClick={handleAudit} disabled={isBusy} className="group font-tech font-bold uppercase py-2 md:py-2.5 bg-slate-900/80 hover:bg-[#00f0ff]/20 text-[#00f0ff] border border-slate-700 hover:border-[#00f0ff] transition-all disabled:opacity-50 text-[10px] md:text-xs flex items-center justify-center gap-1">
                    <ShieldAlert className="w-3 h-3 group-hover:animate-pulse" /> <span>AUDIT</span>
                  </button>
                  <button onClick={handleSmartFix} disabled={isBusy} className="group font-tech font-bold uppercase py-2 md:py-2.5 bg-slate-900/80 hover:bg-[#ffb000]/20 text-[#ffb000] border border-slate-700 hover:border-[#ffb000] transition-all disabled:opacity-50 text-[10px] md:text-xs flex items-center justify-center gap-1">
                    <Wrench className="w-3 h-3 group-hover:animate-spin" /> <span>REPAIR</span>
                  </button>
                  <button onClick={loadCurrent} disabled={isBusy} className="group font-tech font-bold uppercase py-2 md:py-2.5 bg-slate-900/80 hover:bg-white/20 text-slate-300 border border-slate-700 hover:border-white transition-all disabled:opacity-50 text-[10px] md:text-xs flex items-center justify-center gap-1">
                    <RefreshCw className="w-3 h-3" /> <span>RELOAD</span>
                  </button>
                  <button onClick={handleSave} disabled={isBusy} className="group font-tech font-bold uppercase py-2 md:py-2.5 bg-[#00f0ff]/10 hover:bg-[#00f0ff]/30 text-[#00f0ff] border border-[#00f0ff]/50 shadow-[0_0_10px_rgba(0,240,255,0.2)] transition-all disabled:opacity-50 text-[10px] md:text-xs flex items-center justify-center gap-1">
                    <Save className="w-3 h-3" /> <span className="tracking-widest">EXECUTE</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Header 戰區 (霸氣排版) */}
            <header className="flex flex-col md:flex-row justify-between items-start md:items-end border-b-2 border-[#00f0ff]/40 pb-3 gap-2 relative overflow-visible">
              <div className="w-full md:w-auto flex items-center gap-4">
                <div className="hidden md:block -ml-4 -mt-2">
                  <ThreeCore size={80} />
                </div>
                <div>
                  <div className="font-tech text-[#00f0ff]/60 text-[10px] md:text-xs tracking-widest mb-1 flex items-center gap-2">
                    <Fingerprint className="w-3 h-3" />
                    {data.subTitle}
                    {data.isPersisted ? 
                      <span className="px-1 py-0.5 bg-[#00ff88]/20 text-[#00ff88] text-[9px] border border-[#00ff88]/50">SECURED</span> : 
                      <span className="px-1 py-0.5 bg-[#ffb000]/20 text-[#ffb000] text-[9px] border border-[#ffb000]/50">UNSAFE</span>
                    }
                  </div>
                  <h1 className="text-lg md:text-2xl font-black text-white tracking-wider flex items-center gap-2 truncate uppercase">
                    <Crosshair className="w-5 h-5 text-[#ff3366] flex-shrink-0" />
                    {data.title}
                  </h1>
                </div>
              </div>
              <button
                onClick={handleCopy}
                className="w-full md:w-auto font-tech flex items-center justify-center gap-2 px-4 py-1.5 bg-[#000205] border border-[#00f0ff]/50 text-[#00f0ff] hover:bg-[#00f0ff]/20 transition-all shadow-[0_0_10px_rgba(0,240,255,0.1)] uppercase text-[10px] md:text-xs font-bold"
              >
                {copied ? <CheckCircle2 className="w-3 h-3 text-[#00ff88]" /> : <Copy className="w-3 h-3" />}
                {copied ? "DATA_EXTRACTED" : "EXTRACT_DATA"}
              </button>
            </header>

            {/* 大盤數據 (冷硬網格排版) */}
            <div className="grid grid-cols-4 gap-1.5 md:gap-3">
              <div className="p-2 md:p-3 bg-[#000205] border border-slate-800 text-center relative overflow-hidden group">
                <div className="absolute top-0 left-0 w-full h-[1px] bg-[#00f0ff]/50"></div>
                <div className="text-[9px] md:text-[10px] text-slate-500 mb-0.5 font-tech tracking-widest uppercase">SYS.REVENUE</div>
                <div className="text-xs md:text-lg font-tech text-[#00f0ff] font-bold tracking-wider">${formatNum(data.summary.totalRevenue)}</div>
              </div>
              <div className="p-2 md:p-3 bg-[#000205] border border-slate-800 text-center relative overflow-hidden group">
                <div className="absolute top-0 left-0 w-full h-[1px] bg-[#00ff88]/50"></div>
                <div className="text-[9px] md:text-[10px] text-slate-500 mb-0.5 font-tech tracking-widest uppercase">SYS.ACTUAL</div>
                <div className="text-xs md:text-lg font-tech text-[#00ff88] font-bold tracking-wider">${formatNum(data.summary.receivedAmount)}</div>
              </div>
              <div className="p-2 md:p-3 bg-[#000205] border border-slate-800 text-center relative overflow-hidden group">
                <div className="absolute top-0 left-0 w-full h-[1px] bg-[#3b82f6]/50"></div>
                <div className="text-[9px] md:text-[10px] text-slate-500 mb-0.5 font-tech tracking-widest uppercase">SYS.RENEWAL</div>
                <div className="text-xs md:text-lg font-tech text-[#3b82f6] font-bold tracking-wider">${formatNum(data.summary.followupAmount)}</div>
              </div>
              <div className="p-2 md:p-3 bg-[#000205] border border-slate-800 text-center relative overflow-hidden group">
                <div className="absolute top-0 left-0 w-full h-[1px] bg-[#a855f7]/50"></div>
                <div className="text-[9px] md:text-[10px] text-slate-500 mb-0.5 font-tech tracking-widest uppercase">SYS.DEALS</div>
                <div className="text-xs md:text-lg font-tech text-[#a855f7] font-bold tracking-wider">{data.summary.followupCount}</div>
              </div>
            </div>

            {/* AI 比例原則與大數據分析 (新增區塊) */}
            <div className="mt-8 mb-6 relative">
              <div className="scan-line"></div>
              <div className="flex items-center gap-2 mb-3">
                <div className="w-2 h-2 bg-[#ff3366] animate-pulse"></div>
                <h2 className="text-sm md:text-base font-black text-[#ff3366] font-tech tracking-widest uppercase">
                  [ AI_SCORING_PROTOCOL_ANALYSIS ]
                </h2>
                <div className="h-[1px] bg-gradient-to-r from-[#ff3366]/50 to-transparent flex-1"></div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                {/* 左側：權重公式 */}
                <div className="md:col-span-1 border border-slate-800 bg-[#000205] p-3 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-8 h-8 border-t border-r border-[#ff3366]/30"></div>
                  <div className="text-[10px] md:text-xs text-slate-500 font-tech mb-2 tracking-widest uppercase">SYS.WEIGHT_MATRIX</div>
                  <div className="space-y-1 text-xs font-tech text-slate-300">
                    <div className="flex justify-between"><span>實收總額</span><span className="text-[#00ff88]">3000 PT</span></div>
                    <div className="flex justify-between"><span>追續金額</span><span className="text-[#3b82f6]">2500 PT</span></div>
                    <div className="flex justify-between"><span>全部總額</span><span className="text-[#00f0ff]">1500 PT</span></div>
                    <div className="flex justify-between"><span>追續客單</span><span className="text-[#ffb000]">1500 PT</span></div>
                    <div className="flex justify-between"><span>追續單數</span><span className="text-[#a855f7]">1500 PT</span></div>
                  </div>
                  <div className="mt-2 pt-2 border-t border-slate-800 text-[10px] text-[#ff3366] font-tech font-bold text-center tracking-widest">
                    MAXIMUM_CAPACITY: 10000 PT
                  </div>
                </div>

                {/* 右側：大數據極值分析 */}
                <div className="md:col-span-2 border border-[#00f0ff]/30 bg-[#00f0ff]/5 p-3 relative">
                  <div className="text-[10px] md:text-xs text-[#00f0ff] font-tech mb-2 tracking-widest uppercase flex items-center gap-2">
                    <Cpu className="w-3 h-3" /> BIG_DATA_MAXIMUM_OVERRIDE
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                    {data.analysis.actualMax.max > 0 && (
                      <div className="flex items-center gap-2 border-b border-slate-800 pb-1">
                        <span className="w-16 text-[10px] text-slate-500 font-tech">實收最高</span>
                        <span className="text-sm font-bold text-[#00ff88] font-tech w-16">${formatNum(data.analysis.actualMax.max)}</span>
                        <span className="text-xs text-slate-300 truncate flex-1">{data.analysis.actualMax.names.join(", ")}</span>
                      </div>
                    )}
                    {data.analysis.renewalAmtMax.max > 0 && (
                      <div className="flex items-center gap-2 border-b border-slate-800 pb-1">
                        <span className="w-16 text-[10px] text-slate-500 font-tech">追續最高</span>
                        <span className="text-sm font-bold text-[#3b82f6] font-tech w-16">${formatNum(data.analysis.renewalAmtMax.max)}</span>
                        <span className="text-xs text-slate-300 truncate flex-1">{data.analysis.renewalAmtMax.names.join(", ")}</span>
                      </div>
                    )}
                    {data.analysis.totalMax.max > 0 && (
                      <div className="flex items-center gap-2 border-b border-slate-800 pb-1">
                        <span className="w-16 text-[10px] text-slate-500 font-tech">總業績最高</span>
                        <span className="text-sm font-bold text-[#00f0ff] font-tech w-16">${formatNum(data.analysis.totalMax.max)}</span>
                        <span className="text-xs text-slate-300 truncate flex-1">{data.analysis.totalMax.names.join(", ")}</span>
                      </div>
                    )}
                    {data.analysis.renewalCountMax.max > 0 && (
                      <div className="flex items-center gap-2 border-b border-slate-800 pb-1">
                        <span className="w-16 text-[10px] text-slate-500 font-tech">追續單數</span>
                        <span className="text-sm font-bold text-[#a855f7] font-tech w-16">{data.analysis.renewalCountMax.max} 單</span>
                        <span className="text-xs text-slate-300 truncate flex-1">{data.analysis.renewalCountMax.names.join(", ")}</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* A1 至尊榮耀殿堂 (霸氣方正、無圓角、強烈掃描線) */}
            <div className="mt-8 mb-6">
              <div className="flex items-center gap-2 mb-3">
                <div className="w-2 h-2 bg-[#ffb000] animate-pulse"></div>
                <h2 className="text-sm md:text-base font-black text-[#ffb000] font-tech tracking-widest">
                  [ ELITE_VANGUARD_PROTOCOL ]
                </h2>
                <div className="h-[1px] bg-gradient-to-r from-[#ffb000]/50 to-transparent flex-1"></div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                {eliteRanks.map((item, idx) => {
                  const isTop1 = item.rank === 1;
                  return (
                    <motion.div 
                      key={item.name + idx}
                      initial={{ opacity: 0, scale: 0.98 }}
                      animate={{ opacity: 1, scale: 1 }}
                      transition={{ delay: idx * 0.1 }}
                      className={`relative p-3 md:p-4 bg-[#000205] ${isTop1 ? 'glory-glow-1' : 'glory-glow-other'} overflow-hidden group`}
                    >
                      {/* 科技裝飾角 */}
                      <div className={`absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 ${isTop1 ? 'border-[#ffb000]' : 'border-[#00f0ff]'} opacity-50`}></div>
                      <div className={`absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 ${isTop1 ? 'border-[#ffb000]' : 'border-[#00f0ff]'} opacity-50`}></div>
                      
                      <div className="flex justify-between items-start mb-3 relative z-10">
                        <div className="flex items-end gap-2 md:gap-3">
                          <div className={`text-5xl md:text-6xl font-black font-tech leading-none ${isTop1 ? 'text-[#ffb000]' : 'text-[#00f0ff]'}`}>
                            0{item.rank}
                          </div>
                          <div className="pb-1">
                            <div className="font-tech text-[9px] md:text-[10px] text-slate-500 mb-0.5 tracking-widest uppercase">ID: {item.name.substring(0,2).toUpperCase()}_{item.rank}</div>
                            <div className={`text-lg md:text-xl font-bold flex items-center gap-2 tracking-wider ${isTop1 ? 'text-white' : 'text-slate-200'}`}>
                              {item.name}
                              {isTop1 && <span className="px-1.5 py-0.5 bg-[#ffb000] text-black text-[9px] font-tech font-black uppercase">SUPREME</span>}
                            </div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="text-[8px] md:text-[9px] text-slate-500 font-tech tracking-widest mb-0.5">> AI_SCORE</div>
                          <div className={`text-xl md:text-2xl font-black font-tech ${isTop1 ? 'text-[#ffb000]' : 'text-[#00f0ff]'}`}>
                            {formatNum(item.finalScore)}
                          </div>
                          <div className={`text-[9px] font-tech font-bold mt-1 uppercase ${item.rankChange === 'up' ? 'text-[#00ff88]' : item.rankChange === 'down' ? 'text-[#ff3366]' : 'text-slate-500'}`}>
                            {item.rankChange === 'up' ? '↑ RISING' : item.rankChange === 'down' ? '↓ DROPPING' : '- STABLE'}
                          </div>
                        </div>
                      </div>

                      <div className={`mt-2 p-2 border-l-2 text-xs md:text-sm font-medium tracking-wide ${isTop1 ? 'border-[#ffb000] bg-[#ffb000]/5 text-[#ffb000]' : 'border-[#00f0ff] bg-[#00f0ff]/5 text-[#00f0ff]'}`}>
                        <strong className="font-tech opacity-70 mr-2 uppercase text-[10px]">> DIRECTIVE:</strong>
                        {item.advice}
                      </div>
                    </motion.div>
                  );
                })}
              </div>
            </div>

            {/* 標準派單順序 (Rank 5+) 科技條列式 */}
            <div className="mt-6">
              <div className="flex items-center gap-2 mb-3">
                <div className="w-2 h-2 bg-slate-500"></div>
                <h2 className="text-xs md:text-sm font-bold text-slate-400 font-tech tracking-widest uppercase">
                  [ STANDARD_OPERATIVES_MATRIX ]
                </h2>
                <div className="h-[1px] bg-slate-800 flex-1"></div>
              </div>

              <div className="space-y-1.5">
                <AnimatePresence>
                  {standardRanks.map((item, idx) => (
                    <motion.div
                      initial={{ opacity: 0, x: -10 }}
                      animate={{ opacity: 1, x: 0 }}
                      transition={{ delay: idx * 0.02 }}
                      key={item.name + idx}
                      className="group bg-[#000205] border border-slate-800 p-2 md:p-2.5 flex items-center justify-between gap-2 hover:border-[#00f0ff]/50 transition-colors relative overflow-hidden"
                    >
                      {/* Hover Scan effect */}
                      <div className="absolute top-0 left-0 h-full w-[2px] bg-[#00f0ff] opacity-0 group-hover:opacity-100 transition-opacity"></div>
                      
                      <div className="flex items-center gap-2 md:gap-3 flex-1 min-w-0 pl-1 md:pl-2">
                        <div className="text-xs md:text-sm font-tech text-slate-500 w-5 text-right">
                          {item.rank < 10 ? `0${item.rank}` : item.rank}
                        </div>
                        <div className="font-bold text-slate-300 w-16 md:w-20 truncate">
                          {item.name}
                        </div>
                        <div className="text-[10px] md:text-xs text-slate-500 truncate flex-1 font-mono group-hover:text-[#00f0ff]/80 transition-colors">
                          <span className="opacity-50 mr-1">></span>{item.advice}
                        </div>
                      </div>

                      <div className="flex items-center gap-2 md:gap-4 flex-shrink-0">
                        <div className="flex items-center justify-center w-4 h-4 bg-slate-900 border border-slate-800">
                          {getRankIcon(item.rankChange)}
                        </div>
                        <div className="text-right w-16 md:w-20">
                          <div className="font-tech font-bold text-slate-300 text-xs md:text-sm group-hover:text-[#00f0ff] transition-colors">
                            {formatNum(item.finalScore)}
                          </div>
                        </div>
                      </div>
                    </motion.div>
                  ))}
                </AnimatePresence>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<AIDispatchDashboard />);
  </script>
</body>
</html>
