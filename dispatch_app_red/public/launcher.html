<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zhaogui AI System Boot</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #05080c; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #mobile-boot-frame {
      width: 420px; height: 880px; border: 12px solid #1a2332; border-radius: 54px;
      background: #09111f; position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center; overflow: hidden;
      box-shadow: 0 50px 100px rgba(0,0,0,0.8);
      animation: phonePulse 4s ease-in-out infinite;
    }
    @keyframes phonePulse { 0%, 100% { box-shadow: 0 50px 100px rgba(0,0,0,0.8); } 50% { box-shadow: 0 50px 120px rgba(24,198,167,0.15); } }
    
    .biometric-circle {
      width: 120px; height: 120px; border: 2px solid rgba(24, 198, 167, 0.2);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      position: relative; margin-bottom: 40px;
    }
    .biometric-scan {
      position: absolute; width: 100%; height: 2px; background: #18c6a7;
      box-shadow: 0 0 15px #18c6a7; animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove { 0%, 100% { top: 10%; } 50% { top: 90%; } }
    
    .loading-text { color: #18c6a7; font-size: 14px; font-weight: 900; letter-spacing: 5px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    
    .mobile-notch { position: absolute; top: 0; width: 160px; height: 34px; background: #1a2332; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
  </style>
</head>
<body>
  <div id="mobile-boot-frame">
    <div class="mobile-notch"></div>
    <div class="biometric-circle">
      <div class="biometric-scan"></div>
      <span style="font-size: 40px;">👤</span>
    </div>
    <div class="loading-text">SYSTEM SECURED</div>
    <div style="margin-top: 20px; color: rgba(24,198,167,0.4); font-size: 10px;">ID: ZHAOGUI-MOBILE-CORE</div>
  </div>

  <script>
    // 啟動器強制手機版導向
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 3000);
  </script>
</body>
</html>
