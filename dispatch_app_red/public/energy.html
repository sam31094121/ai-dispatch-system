<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI 能量核心｜兆櫃派單</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden; background: #000;
      font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; color: #fff;
    }

    /* ── HUD Top ── */
    #hud-top {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 0; right: 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 0 16px; z-index: 20; pointer-events: none;
    }
    .hud-brand { display: flex; flex-direction: column; gap: 2px; }
    .hud-kicker {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      color: #18c6a7; letter-spacing: 0.10em;
    }
    .hud-main {
      font-size: 20px; font-weight: 900; color: #fff;
      text-shadow: 0 0 24px rgba(255,0,255,.5), 0 0 44px rgba(0,255,255,.3);
    }
    #back-btn {
      pointer-events: all; padding: 9px 16px; border-radius: 10px;
      border: 1px solid rgba(243,193,75,.40); background: rgba(0,0,0,.62);
      color: #f3c14b; font-size: 13px; font-weight: 800;
      text-decoration: none; backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); transition: all .15s;
    }
    #back-btn:active { background: rgba(243,193,75,.15); border-color: rgba(243,193,75,.72); }

    /* ── Detail Panel ── */
    #detail-panel {
      position: fixed;
      bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px));
      left: 50%; transform: translateX(-50%) translateY(18px);
      z-index: 30; min-width: 200px; max-width: min(300px, calc(100% - 32px));
      padding: 14px 18px 16px; border-radius: 16px;
      background: rgba(0,0,0,.75); border: 1px solid rgba(243,193,75,.48);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      opacity: 0; pointer-events: none; text-align: center;
      transition: opacity .3s ease, transform .3s ease;
    }
    #detail-panel.visible {
      opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: all;
    }
    #detail-rank  { font-size: 11px; font-weight: 800; color: #f3c14b; letter-spacing: .08em; margin-bottom: 4px; }
    #detail-name  { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 5px; }
    #detail-score { font-size: 13px; color: #18c6a7; font-weight: 700; }
    #detail-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: rgba(255,255,255,.35);
      font-size: 20px; cursor: pointer; line-height: 1; padding: 2px;
    }

    /* ── Bottom Rank HUD ── */
    #rank-hud {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      display: flex; justify-content: center; flex-wrap: wrap; gap: 7px;
      padding: 0 12px; z-index: 20; pointer-events: none;
      opacity: 0; transition: opacity 1s ease .6s;
    }
    #rank-hud.show { opacity: 1; }
    .rank-chip {
      padding: 5px 13px; border-radius: 999px;
      background: rgba(0,0,0,.68); border: 1px solid rgba(243,193,75,.28);
      color: #f3c14b; font-size: 12px; font-weight: 800;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      white-space: nowrap; cursor: pointer; pointer-events: all;
      transition: border-color .15s, background .15s;
    }
    .rank-chip:active { background: rgba(243,193,75,.14); }
    .rank-chip.r1 { border-color: rgba(255,215,0,.75); color: #ffd700; font-size: 13px; }
    .rank-chip.r2 { border-color: rgba(200,215,230,.50); color: #dce8f0; }
    .rank-chip.r3 { border-color: rgba(205,139,74,.55); color: #cd8b4a; }

    /* ── Side Stats ── */
    #stats-hud {
      position: fixed; top: 50%; right: 14px; transform: translateY(-50%);
      z-index: 20; display: flex; flex-direction: column; gap: 9px;
      pointer-events: none; opacity: 0; transition: opacity 1s ease 1s;
    }
    #stats-hud.show { opacity: 1; }
    .stat-pill {
      padding: 7px 11px; border-radius: 8px;
      background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 94px;
    }
    .stat-label { display: block; font-size: 9px; font-weight: 700; color: rgba(154,168,186,.85); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
    .stat-val   { display: block; font-size: 13px; font-weight: 900; color: #f3c14b; overflow-wrap: anywhere; }

    /* ── Loading ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; color: #18c6a7; font-size: 14px; font-weight: 700;
      gap: 18px; letter-spacing: .04em; transition: opacity .8s ease;
    }
    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    .loading-ring {
      width: 52px; height: 52px; border-radius: 50%;
      border: 3px solid rgba(24,198,167,.18); border-top-color: #18c6a7;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed;
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 50px);
      left: 50%; transform: translateX(-50%);
      z-index: 20; font-size: 10px; color: rgba(255,255,255,.18);
      pointer-events: none; white-space: nowrap; letter-spacing: .06em;
    }

    @media (max-width: 380px) {
      .hud-main { font-size: 17px; }
      #stats-hud { display: none; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="loading-overlay">
  <div class="loading-ring"></div>
  <span>能量核心初始化中…</span>
</div>

<div id="hud-top">
  <div class="hud-brand">
    <span class="hud-kicker">Zhaogui AI Dispatch</span>
    <span class="hud-main">AI 能量核心</span>
  </div>
  <a id="back-btn" href="/mobile.html">← 返回</a>
</div>

<div id="stats-hud">
  <div class="stat-pill"><span class="stat-label">追續成交</span><span class="stat-val" id="stat-renewal">--</span></div>
  <div class="stat-pill"><span class="stat-label">總業績</span><span class="stat-val" id="stat-revenue">--</span></div>
  <div class="stat-pill"><span class="stat-label">實收</span><span class="stat-val" id="stat-cash">--</span></div>
</div>

<div id="rank-hud"></div>

<div id="detail-panel">
  <button id="detail-close">×</button>
  <div id="detail-rank">-- 排名</div>
  <div id="detail-name">--</div>
  <div id="detail-score"></div>
</div>

<div id="hint">拖曳旋轉 · 雙指縮放 · 點擊排名球</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/controls/OrbitControls.js"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════
//  1. SCENE / CAMERA / RENDERER
// ═══════════════════════════════════════════════════
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 0, 62);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

scene.fog = new THREE.FogExp2(0x000000, 0.006);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.07;
controls.minDistance     = 16;
controls.maxDistance     = 140;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.40;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══════════════════════════════════════════════════
//  2. STAR FIELD
// ═══════════════════════════════════════════════════
(function buildStars() {
  const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    const r  = 300 + Math.random() * 450;
    pos[i*3]   = Math.sin(ph) * Math.cos(th) * r;
    pos[i*3+1] = Math.sin(ph) * Math.sin(th) * r;
    pos[i*3+2] = Math.cos(ph) * r;
    const t    = Math.random();
    col[i*3]   = 0.72 + t * 0.28; col[i*3+1] = 0.72 + t * 0.18; col[i*3+2] = 0.82 + t * 0.18;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g,
    new THREE.PointsMaterial({ size: 0.45, vertexColors: true, transparent: true, opacity: 0.55 })));
})();

// ═══════════════════════════════════════════════════
//  3. MULTI-LAYER ENERGY CORE
// ═══════════════════════════════════════════════════

// Layer 1 — inner solid, vertex-displacement shader
const coreMat = new THREE.ShaderMaterial({
  uniforms: {
    time:   { value: 0.0 },
    color1: { value: new THREE.Color(0xff00ff) },
    color2: { value: new THREE.Color(0x00ffff) },
    color3: { value: new THREE.Color(0xf3c14b) }
  },
  vertexShader: `
    uniform float time;
    varying vec3 vPos; varying vec3 vNormal;
    void main() {
      vPos = position; vNormal = normal;
      vec3 p = position;
      float d = sin(p.x*2.0+time*2.8) * cos(p.y*2.0+time*1.9) * 0.90;
      p += normal * d;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
    }
  `,
  fragmentShader: `
    uniform float time; uniform vec3 color1,color2,color3;
    varying vec3 vPos; varying vec3 vNormal;
    void main() {
      float a   = sin(length(vPos)*0.55+time*2.4)*0.5+0.5;
      float b   = cos(vPos.y*0.95+time*1.6)*0.5+0.5;
      float pls = sin(time*4.0)*0.5+0.5;
      vec3  c   = mix(color1,color2,a);
      c         = mix(c,color3,b*pls*0.32);
      float rim = 1.0-max(dot(normalize(vNormal),vec3(0,0,1)),0.0);
      c        += vec3(1.0,0.95,0.6)*pow(rim,2.5)*0.45;
      gl_FragColor = vec4(c,1.0);
    }
  `
});
const core1 = new THREE.Mesh(new THREE.IcosahedronGeometry(7, 3), coreMat);
scene.add(core1);

// Layer 2 — gold dodecahedron wireframe (medium speed)
const core2 = new THREE.Mesh(
  new THREE.DodecahedronGeometry(9.0, 0),
  new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, transparent: true, opacity: 0.22 })
);
scene.add(core2);

// Layer 3 — cyan icosahedron wireframe (slow, reverse)
const core3 = new THREE.Mesh(
  new THREE.IcosahedronGeometry(10.8, 1),
  new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.11 })
);
scene.add(core3);

// Glow halos (additive back-face spheres)
function addGlow(r, col, op) {
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(r, 24, 24),
    new THREE.MeshBasicMaterial({
      color: col, transparent: true, opacity: op,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
    })
  ));
}
addGlow(11.5, 0xff00ff, 0.11);
addGlow(14.5, 0x00ffff, 0.07);
addGlow(9.8,  0xffd700, 0.13);

// ═══════════════════════════════════════════════════
//  4. ORBIT RINGS
// ═══════════════════════════════════════════════════
function makeRing(r, col, tiltX, tiltZ) {
  const mat = new THREE.MeshBasicMaterial({
    color: col, transparent: true, opacity: 0.48,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(r, 0.14, 8, 100), mat);
  mesh.rotation.x = tiltX;
  mesh.rotation.z = tiltZ;
  scene.add(mesh);
  return { mesh, mat };
}
const rings = [
  makeRing(12.2, 0xff00ff, 0,              0),
  makeRing(14.8, 0x00ffff, Math.PI * 0.38, Math.PI * 0.15),
  makeRing(17.2, 0xf3c14b, Math.PI * 0.62, Math.PI * 0.45),
];

// ═══════════════════════════════════════════════════
//  5. DYNAMIC PARTICLE FIELD
// ═══════════════════════════════════════════════════
const PCOUNT = innerWidth < 480 ? 2000 : 3600;
const pPos   = new Float32Array(PCOUNT * 3);
const pSpd   = new Float32Array(PCOUNT);
const pCol   = new Float32Array(PCOUNT * 3);
const PAL    = [[1,0,1],[0,1,1],[1,.76,.29],[.9,.9,1],[.5,1,.6]];

for (let i = 0; i < PCOUNT; i++) {
  const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random()*2-1);
  const r  = 26 + Math.random() * 22;
  pPos[i*3]   = Math.sin(ph)*Math.cos(th)*r;
  pPos[i*3+1] = Math.sin(ph)*Math.sin(th)*r;
  pPos[i*3+2] = Math.cos(ph)*r;
  pSpd[i]     = Math.random()*.026+.004;
  const c = PAL[Math.floor(Math.random()*PAL.length)];
  pCol[i*3] = c[0]; pCol[i*3+1] = c[1]; pCol[i*3+2] = c[2];
}

const partGeom = new THREE.BufferGeometry();
partGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
partGeom.setAttribute('aSpeed',   new THREE.BufferAttribute(pSpd, 1));
partGeom.setAttribute('aColor',   new THREE.BufferAttribute(pCol, 3));

const partMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0.0 } },
  vertexShader: `
    attribute float aSpeed; attribute vec3 aColor;
    uniform float time;
    varying float vAlpha; varying vec3 vCol;
    void main() {
      vCol = aColor;
      float s = sin(time*aSpeed*6.5+length(position)*.11);
      vAlpha  = .38+.52*(s*.5+.5);
      float sz= 2.0+2.8*(s*.5+.5);
      vec4 mv = modelViewMatrix*vec4(position,1.0);
      gl_PointSize = sz*(300.0/-mv.z);
      gl_Position  = projectionMatrix*mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha; varying vec3 vCol;
    void main() {
      vec2 st=gl_PointCoord*2.0-1.0;
      float a=smoothstep(1.0,.25,length(st))*vAlpha;
      gl_FragColor=vec4(vCol,a);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
scene.add(new THREE.Points(partGeom, partMat));

// ═══════════════════════════════════════════════════
//  6. RANK SPHERES + NAME SPRITES + CONNECTION LINES
// ═══════════════════════════════════════════════════
const RCOLS = [0xffd700, 0xdce8f0, 0xcd8b4a, 0x18c6a7, 0xcc88ff, 0xff8888];
const rankObjects = [];
let   rankData    = [];

function makeNameSprite(person, rank) {
  const CW = 320, CH = 76;
  const cv = document.createElement('canvas');
  cv.width = CW; cv.height = CH;
  const ctx = cv.getContext('2d');

  // pill bg
  ctx.fillStyle = 'rgba(0,0,0,0.70)';
  const rx = 14;
  ctx.beginPath();
  ctx.moveTo(rx, 0); ctx.lineTo(CW-rx, 0);
  ctx.quadraticCurveTo(CW, 0, CW, rx);
  ctx.lineTo(CW, CH-rx); ctx.quadraticCurveTo(CW, CH, CW-rx, CH);
  ctx.lineTo(rx, CH); ctx.quadraticCurveTo(0, CH, 0, CH-rx);
  ctx.lineTo(0, rx); ctx.quadraticCurveTo(0, 0, rx, 0);
  ctx.closePath(); ctx.fill();

  // border
  const bCol = ['#ffd700','#dce8f0','#cd8b4a','#18c6a7','#cc88ff','#ff8888'][Math.min(rank,5)];
  ctx.strokeStyle = bCol; ctx.lineWidth = 2; ctx.stroke();

  // rank label
  ctx.fillStyle = bCol; ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`No.${rank+1}`, 12, 10);

  // name
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(person.name || '—', CW/2, CH/2+5);

  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false });
  const sp  = new THREE.Sprite(mat);
  sp.scale.set(14, 3.3, 1);
  return sp;
}

function placeRankObjects(people) {
  rankObjects.forEach(o => { scene.remove(o.mesh); scene.remove(o.sprite); scene.remove(o.line); });
  rankObjects.length = 0;
  rankData = people;

  const n = Math.min(people.length, 6);
  for (let i = 0; i < n; i++) {
    const angle  = (i / n) * Math.PI * 2;
    const radius = 20 + (i < 3 ? 0 : 4);
    const sz     = i === 0 ? 1.75 : i < 3 ? 1.18 : 0.90;

    const mat  = new THREE.MeshBasicMaterial({
      color: RCOLS[i], transparent: true, opacity: 0.88,
      blending: THREE.AdditiveBlending
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(sz, 20, 20), mat);
    mesh.position.set(Math.cos(angle)*radius, (Math.random()-.5)*8, Math.sin(angle)*radius);

    const sprite = makeNameSprite(people[i], i);
    sprite.position.copy(mesh.position);
    sprite.position.y += sz + 2.6;

    // connection line (updated per-frame)
    const linePts  = [new THREE.Vector3(), mesh.position.clone()];
    const lineGeom = new THREE.BufferGeometry().setFromPoints(linePts);
    const lineMat  = new THREE.LineBasicMaterial({ color: RCOLS[i], transparent: true, opacity: 0.14 });
    const line     = new THREE.Line(lineGeom, lineMat);

    scene.add(mesh, sprite, line);
    rankObjects.push({
      mesh, sprite, line, lineMat, mat,
      person: people[i], rank: i,
      angle, radius,
      baseY: mesh.position.y,
      spd: .38 + Math.random() * .44
    });
  }
}

// initial placeholders
placeRankObjects(Array.from({ length: 6 }, () => ({ name: '—' })));

// ═══════════════════════════════════════════════════
//  7. SHOCKWAVE RINGS
// ═══════════════════════════════════════════════════
const shockwaves = [];
let lastShock = 0;

function spawnShockwave() {
  if (shockwaves.length >= 6) return;
  const mat  = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.72, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const mesh = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.55, 72), mat);
  mesh.rotation.x = Math.random() * Math.PI;
  mesh.rotation.z = Math.random() * Math.PI;
  scene.add(mesh);
  shockwaves.push({ mesh, mat, p: 0 });
}

function tickShockwaves(t) {
  if (t - lastShock > 2.6) { spawnShockwave(); lastShock = t; }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.p += 0.016;
    sw.mesh.scale.setScalar(1 + sw.p * 7.5);
    sw.mat.opacity = Math.max(0, 0.72 - sw.p * 0.78);
    if (sw.p >= 1) { scene.remove(sw.mesh); shockwaves.splice(i, 1); }
  }
}

// ═══════════════════════════════════════════════════
//  8. LIGHTS
// ═══════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x202020));
const pL1 = new THREE.PointLight(0xff00ff, 3.2, 125); pL1.position.set(30, 40, 20); scene.add(pL1);
const pL2 = new THREE.PointLight(0x00ffff, 2.4, 115); pL2.position.set(-38, -32, -22); scene.add(pL2);
const pL3 = new THREE.PointLight(0xffd700, 1.6, 95);  pL3.position.set(0, -52, 10); scene.add(pL3);

// ═══════════════════════════════════════════════════
//  9. CLICK INTERACTION
// ═══════════════════════════════════════════════════
const raycaster    = new THREE.Raycaster();
const pointer      = new THREE.Vector2();
const detailPanel  = document.getElementById('detail-panel');
const detailRank   = document.getElementById('detail-rank');
const detailName   = document.getElementById('detail-name');
const detailScore  = document.getElementById('detail-score');
let   selectedIdx  = -1;

function showDetail(idx) {
  const p = rankData[idx];
  if (!p || !p.name || p.name === '—') return;
  selectedIdx = idx;
  const medal = ['🥇','🥈','🥉'][idx] || `No.${idx+1}`;
  detailRank.textContent  = `${medal}  第 ${idx+1} 名`;
  detailName.textContent  = p.name;
  detailScore.textContent = p.score != null ? `AI 分數：${p.score}` : (p.group ? `分組：${p.group}` : '');
  detailPanel.classList.add('visible');
  controls.autoRotate = false;
}

document.getElementById('detail-close').addEventListener('click', () => {
  detailPanel.classList.remove('visible');
  selectedIdx = -1;
  controls.autoRotate = true;
});

function handlePick(cx, cy) {
  pointer.x =  (cx / innerWidth)  * 2 - 1;
  pointer.y = -(cy / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = rankObjects.map(o => o.mesh);
  const hits   = raycaster.intersectObjects(meshes);
  if (hits.length) {
    const idx = meshes.indexOf(hits[0].object);
    if (idx >= 0) showDetail(idx);
  }
}

renderer.domElement.addEventListener('pointerdown', e => handlePick(e.clientX, e.clientY));
renderer.domElement.addEventListener('touchstart',
  e => handlePick(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

document.getElementById('rank-hud').addEventListener('click', e => {
  const chip = e.target.closest('.rank-chip');
  if (chip) showDetail(+chip.dataset.idx);
});

// ═══════════════════════════════════════════════════
//  10. API DATA
// ═══════════════════════════════════════════════════
async function loadData() {
  try {
    const json   = await fetch('/api/current').then(r => r.json());
    const d      = json.data || {};
    const ranked = d.rankedPeople || d.ranking || [];

    if (ranked.length) {
      placeRankObjects(ranked);
      document.getElementById('rank-hud').innerHTML = ranked.slice(0, 6).map((p, i) => {
        const cls   = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
        return `<span class="rank-chip ${cls}" data-idx="${i}">${medal} ${p.name}</span>`;
      }).join('');
    }

    document.getElementById('rank-hud').classList.add('show');
    if (d.renewalDeals !== undefined) document.getElementById('stat-renewal').textContent = d.renewalDeals;
    if (d.totalRevenue !== undefined) document.getElementById('stat-revenue').textContent = d.totalRevenue;
    if (d.cashRevenue  !== undefined) document.getElementById('stat-cash').textContent    = d.cashRevenue;
    document.getElementById('stats-hud').classList.add('show');
  } catch (_) {
    document.getElementById('rank-hud').classList.add('show');
    document.getElementById('stats-hud').classList.add('show');
  }
}
loadData();

// ═══════════════════════════════════════════════════
//  11. ANIMATION LOOP
// ═══════════════════════════════════════════════════
function animate(time) {
  requestAnimationFrame(animate);
  const t = time * 0.001;

  // uniforms
  coreMat.uniforms.time.value = t;
  partMat.uniforms.time.value = t;

  // core layers — 3 independent axes
  core1.rotation.x += 0.0048; core1.rotation.y += 0.0080;
  core2.rotation.x  = core1.rotation.x * 0.60;
  core2.rotation.y  = core1.rotation.y * 0.78; core2.rotation.z += 0.0030;
  core3.rotation.x  = -core1.rotation.x * 0.38;
  core3.rotation.y  = -core1.rotation.y * 0.50; core3.rotation.z += 0.0040;

  // rings
  rings[0].mesh.rotation.z  =  t * 0.26;
  rings[1].mesh.rotation.z  = -t * 0.19; rings[1].mesh.rotation.y = t * 0.10;
  rings[2].mesh.rotation.z  =  t * 0.13; rings[2].mesh.rotation.x += 0.004;
  const pulse = Math.sin(t * 3.1) * .5 + .5;
  rings[0].mat.opacity = 0.28 + pulse * 0.30;
  rings[1].mat.opacity = 0.20 + pulse * 0.24;
  rings[2].mat.opacity = 0.18 + pulse * 0.20;

  // rank sphere orbit
  rankObjects.forEach((ro, i) => {
    ro.angle += ro.spd * 0.008;
    const x = Math.cos(ro.angle) * ro.radius;
    const z = Math.sin(ro.angle) * ro.radius;
    const y = ro.baseY + Math.sin(t * 1.2 + i) * 1.8;
    ro.mesh.position.set(x, y, z);
    ro.sprite.position.set(x, y + (i === 0 ? 2.3 : 1.9), z);

    // update line endpoint
    const lp = ro.line.geometry.attributes.position;
    lp.setXYZ(1, x, y, z); lp.needsUpdate = true;

    // pulse opacity & line brightness
    const sp = Math.sin(t * 2.0 + i) * .5 + .5;
    ro.mat.opacity     = 0.55 + sp * 0.35;
    ro.lineMat.opacity = 0.10 + sp * 0.16;

    // highlight selected sphere
    ro.mesh.scale.setScalar(i === selectedIdx ? 1.3 + Math.sin(t * 4) * 0.10 : 1.0);
  });

  // shockwaves
  tickShockwaves(t);

  // light pulsing
  pL1.intensity = 2.8 + Math.sin(t * 2.0) * 0.9;
  pL2.intensity = 2.1 + Math.cos(t * 2.5) * 0.7;
  pL3.intensity = 1.4 + Math.sin(t * 3.3) * 0.5;

  controls.update();
  renderer.render(scene, camera);
}

// ── boot ──────────────────────────────────────────
const overlay = document.getElementById('loading-overlay');
setTimeout(() => {
  overlay.classList.add('fade-out');
  setTimeout(() => overlay.remove(), 900);
  animate(0);
}, 1000);
</script>
